# Every push. problems: each problem has problem.md, valid meta.json and .in/.out pairs, and index.json
# matches problems/. Needs no compilers: expected outputs are generated locally by npm run build.
name: check

on:
  push:
  pull_request:

jobs:
  problems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run check

  # The extension's unit tests (node:test) with real compilers. Linux and Mac cover the POSIX memwatch
  # path and their crash reporters; Mac's g++ is Apple clang (libc++, atos, no bits/stdc++.h).
  # Tests whose compiler is missing are skipped.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: g++ --version
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
